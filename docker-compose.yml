# =====================================================================
# Grupo Ricartti — entorno local completo (BD + API + frontend)
#   docker compose up --build     → http://localhost:8080
# Toda la configuración se lee de .env (copia de .env.example).
#
# El frontend vive en otro repositorio (GR-frontend). Compose lo
# construye desde la carpeta hermana:
#   <carpeta>/
#   ├── GR-backend/    ← este repositorio (ejecuta compose aquí)
#   └── GR-frontend/
# Si lo clonaste en otra ruta, ajusta FRONTEND_PATH en .env.
# =====================================================================
name: grupo-ricartti

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Define DB_ADMIN_PASSWORD en .env}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${DB_NAME:-ricartti}
      APP_DB_USER: ${DB_USER:-ricartti_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/sql:/sql:ro
      - ./database/docker/initdb.sh:/docker-entrypoint-initdb.d/10-initdb.sh:ro
      - ./database/docker:/docker-scripts:ro
      - ./database/dump:/dump
    ports:
      # Expuesto en el host para inspeccionar la BD o generar el volcado.
      - "${DB_DOCKER_HOST_PORT:-5433}:5432"
    healthcheck:
      # Por TCP: durante la inicialización el servidor solo escucha por socket,
      # así la API no arranca hasta que el esquema y los datos estén cargados.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${APP_DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ricartti]

  api:
    build: .
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ricartti}
      DB_USER: ${DB_USER:-ricartti_app}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      UPLOADS_PATH: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-ricartti_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_IDLE_MINUTES: ${AUTH_SESSION_IDLE_MINUTES:-30}
      AUTH_SESSION_ABSOLUTE_HOURS: ${AUTH_SESSION_ABSOLUTE_HOURS:-8}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCKOUT_MINUTES: ${AUTH_LOCKOUT_MINUTES:-15}
      RATE_LIMIT_LOGIN_PERMITS: ${RATE_LIMIT_LOGIN_PERMITS:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-60}
      RATE_LIMIT_FORMS_PERMITS: ${RATE_LIMIT_FORMS_PERMITS:-5}
      RATE_LIMIT_FORMS_WINDOW_SECONDS: ${RATE_LIMIT_FORMS_WINDOW_SECONDS:-900}
      RATE_LIMIT_GLOBAL_PERMITS_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PERMITS_PER_MINUTE:-120}
      # Solo se confía en X-Forwarded-For si la petición viene del contenedor
      # Nginx (IP fija). Las peticiones directas al puerto publicado no pueden
      # falsear su IP para saltarse el límite de peticiones.
      TRUSTED_PROXY_IP: 172.28.0.10
    ports:
      # Publicado en el host para desarrollar el frontend con `npm start`
      # (GR-frontend) sin instalar .NET.
      - "${API_PORT:-5080}:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [ricartti]

  web:
    build: ${FRONTEND_PATH:-../GR-frontend}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      ricartti:
        ipv4_address: 172.28.0.10

volumes:
  pgdata:

networks:
  ricartti:
    ipam:
      config:
        - subnet: 172.28.0.0/16
